name: Publish NuGet package

on:
    workflow_dispatch:

env:
    HUSKY: 0

jobs:
    build:

        runs-on: ubuntu-latest
        environment: production
        permissions:
            contents: read
            id-token: write

        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
                with:
                    dotnet-version: |
                        8.0.x
                        9.0.x
                        10.0.x
            -   name: Restore dependencies
                run: dotnet restore
            -   name: Build
                run: dotnet build -c Release --no-restore /p:PublicRelease=true
            -   name: NuGet login
                uses: NuGet/login@v1
                id: login
                with:
                  user: MudBlazor
            -   name: NuGet push
                run: dotnet nuget push "src/*/bin/Release/*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --skip-duplicate --source https://api.nuget.org/v3/index.json
