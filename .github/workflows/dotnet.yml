name: .NET

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

env:
    HUSKY: 0

permissions:
    contents: read
    issues: read
    checks: write
    pull-requests: write

jobs:
    check_formatting:
        runs-on: ubuntu-latest
        name: Check Formatting
        continue-on-error: true
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            -   run: |
                    dotnet tool restore
                    dotnet csharpier check .

    test:
        runs-on: ubuntu-latest
        name: Test
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    fetch-depth: 0

            # Build
            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
                with:
                    dotnet-version: |
                        8.0.x
                        9.0.x
                        10.0.x
            -   name: Restore dependencies
                run: dotnet restore
            -   name: Build
                run: dotnet build --no-restore

            # Test
            -   name: Test
                run: dotnet test --no-build --report-trx --coverage --coverage-output-format cobertura --coverage-output cobertura.xml --results-directory TestResults

            -   name: Publish Test Results
                uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
                if: (!cancelled())
                with:
                    files: |
                        TestResults/*.trx
